{% extends "_navbar.html" %}
{% block content_home %}

<section class="py-4 px-4 lg:py-8">
    <div class="flex flex-col md:flex-row gap-4 lg:gap-8 justify-center items-center">
        <!-- source code -->
        <div class="w-full md:w-1/2 max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm">
            <a href="#">
                <img class="rounded-t-lg" src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?q=80&w=2069&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="" />
            </a>
            <div class="p-5">
                <a href="#">
                    <h5 class="mb-2 text-2xl font-bold text-gray-900 tracking-normal">Source Code</h5>
                </a>
                <p class="mb-3 text-base font-normal tracking-normal text-gray-700">
                    All source code is available on GitHub and released under the MIT License.</p>
                <a href="#" class="inline-flex tracking-normal items-center px-3 py-2 text-sm font-medium text-center text-white bg-green-700 rounded-lg hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300">
                    Learn more
                     <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
                    </svg>
                </a>
            </div>
        </div>
        <!-- journal -->
        <div class="w-full md:w-1/2 max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm">
            <a href="#">
                <img class="rounded-t-lg" src="https://plus.unsplash.com/premium_photo-1684444605542-93725082d214?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8am91cm5hbHxlbnwwfHwwfHx8MA%3D%3D" alt="" />
            </a>
            <div class="p-5">
                <a href="#">
                    <h5 class="mb-2 text-2xl font-bold text-gray-900 tracking-normal">Journal</h5>
                </a>
                <p class="mb-3 text-base font-normal tracking-normal text-gray-700">The journal for this project has been officially published and free to access.</p>
                <a href="#" class="inline-flex tracking-normal items-center px-3 py-2 text-sm font-medium text-center text-white bg-green-700 rounded-lg hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300">
                    Read more
                     <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</section>

{% endblock content_home %}
